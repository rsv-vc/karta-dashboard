name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, build and checks
    runs-on: ubuntu-latest
    env:
      # Public values (safe in the browser); placeholders keep forks building.
      # The test project (karta-test, fictional data); placeholders keep forks building.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_APP_TODAY: "2026-10-28"
      # Only so check:secrets can look for its value in the client bundles.
      DEMO_PASSWORD: ${{ secrets.TEST_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # PageProps/LayoutProps come from Next's route typegen (dev and build create them too).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Pure checks
        run: |
          npm run check:data
          npm run check:permissions
          npm run check:leads
          npm run check:mutations
          npm run check:dashboard
          npm run check:team
          npm run check:reports
          npm run check:accounts
          npm run check:home
          npm run check:deal
      - run: npm run build
      - name: No secrets in client bundles
        run: npm run check:secrets

  database:
    name: RLS, end-to-end and accessibility (test project)
    runs-on: ubuntu-latest
    needs: checks
    # Runs only when the test project's secrets are configured (not on forks). Never
    # touches the live workspace: every URL and key here is karta-test's.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      # Optional: the test project's secret key enables the account tests.
      SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
      DEMO_PASSWORD: ${{ secrets.TEST_DEMO_PASSWORD }}
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_APP_TODAY: "2026-10-28"
    steps:
      - name: Skip without secrets
        id: gate
        run: |
          if [ -z "$DEMO_PASSWORD" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Test project secrets are not set; skipping database and browser tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - name: Row Level Security against the demo project
        if: steps.gate.outputs.run == 'true'
        run: npx tsx scripts/check-rls.mts
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      # One run (one production build): the e2e flows on desktop and phone, then the axe scans.
      - name: End-to-end flows and accessibility scans
        if: steps.gate.outputs.run == 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
